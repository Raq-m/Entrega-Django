{% extends "base.html" %}

{% block title %}Eliminar producto{% endblock %}

{% block content %}
    <h1>Eliminar producto</h1>

    <p>¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <p><a href="{% url 'producto_lista' %}">Cancelar</a></p>
{% endblock %}
